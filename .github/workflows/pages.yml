name: CI and Deploy GitHub Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Keep this version aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --init --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Browser matrix
        run: npm run test:e2e

      - name: GitHub Pages base-path smoke
        run: npm run test:e2e:preview

      - name: Build
        run: npm run build

      - name: Upload browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            node_modules/.cache/playwright*-results/**/test-failed-*.png
            node_modules/.cache/playwright*-results/**/error-context.md
            node_modules/.cache/playwright*-results/**/trace.zip
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
